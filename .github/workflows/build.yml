name: Flutter Engine

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sysroots:
    name: Buildroot sysroots
    runs-on: [self-hosted, linux, x64]
    container:
      image: node:24-trixie
      options: "-v /srv/titan-flutter-engine:/cache"
    env:
      TITAN_WORK_DIR: /cache/work
      TITAN_BUNDLE_DIR: /cache/bundles
      TITAN_CPU_SCOPE: 0
      TITAN_JOBS: ${{ vars.TITAN_JOBS || '8' }}
      GH_TOKEN: ${{ github.token }}
    timeout-minutes: 600
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: scripts/ci.sh deps

      - name: Build Buildroot sysroots
        run: scripts/ci.sh sysroots

  build:
    name: Build Flutter Engine
    needs: sysroots
    runs-on: [self-hosted, linux, x64]
    container:
      image: node:24-trixie
      options: "-v /srv/titan-flutter-engine:/cache"
    env:
      TITAN_WORK_DIR: /cache/work
      TITAN_BUNDLE_DIR: /cache/bundles
      TITAN_CPU_SCOPE: 0
      TITAN_JOBS: ${{ vars.TITAN_JOBS || '8' }}
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v4

      - name: Build engine matrix
        run: scripts/ci.sh build

      - name: Probe engine bundles
        run: scripts/ci.sh probe

      - name: Package engine bundles
        run: scripts/ci.sh package

      - name: Upload engine bundles
        uses: actions/upload-artifact@v4
        with:
          name: flutter-engine-dist
          path: /cache/bundles/dist/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: [self-hosted, linux, x64]
    container:
      image: node:24-trixie
      options: "-v /srv/titan-flutter-engine:/cache"
    env:
      TITAN_BUNDLE_DIR: /cache/bundles
      GH_TOKEN: ${{ github.token }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download engine bundles
        uses: actions/download-artifact@v4
        with:
          name: flutter-engine-dist
          path: /cache/bundles/dist
      - name: Publish GitHub release
        run: scripts/ci.sh release
