name: Flutter Engine

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sysroot:
    name: Build sysroot (${{ matrix.defconfig }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        defconfig: [titan_x64_musl_defconfig, titan_arm64_glibc_defconfig, titan_arm64_musl_defconfig, titan_armv7a_hf_glibc_defconfig, titan_armv7a_hf_musl_defconfig, titan_armv7a_softfp_glibc_defconfig, titan_armv7a_softfp_musl_defconfig, titan_riscv64_glibc_defconfig, titan_riscv64_musl_defconfig]
    env:
      TITAN_WORK_DIR: /mnt/titan/work
      TITAN_BUNDLE_DIR: /mnt/titan/bundles
    steps:
      - uses: actions/checkout@v4
      - name: Prepare workspace
        run: |
          sudo mkdir -p /mnt/titan
          sudo chown "$USER" /mnt/titan
      - name: Install dependencies
        run: scripts/ci.sh deps
      - name: Build sysroot
        run: |
          variant="sysroot-${{ matrix.defconfig }}"
          mkdir -p "$TITAN_WORK_DIR/matrix"
          scripts/ci.sh with-progress "$variant" -- bash -c '
            scripts/ci.sh sysroot "$1" >"$TITAN_WORK_DIR/matrix/$2.log" 2>&1
          ' bash "${{ matrix.defconfig }}" "$variant"
      - name: Package sysroot
        run: scripts/ci.sh sysroot-package "${{ matrix.defconfig }}"
      - name: Upload sysroot build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-sysroot-${{ matrix.defconfig }}
          path: /mnt/titan/work/matrix/
          if-no-files-found: ignore
      - name: Upload sysroot
        uses: actions/upload-artifact@v4
        with:
          name: sysroot-${{ matrix.defconfig }}
          path: /mnt/titan/work/sysroot-${{ matrix.defconfig }}.tar.zst
          retention-days: 3
          if-no-files-found: error

  build:
    name: Build Linux engine (${{ matrix.target }}-${{ matrix.mode }})
    needs: sysroot
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target: [x64, x64-musl, arm64, arm64-musl, arm-hard, arm-hard-musl, arm-softfp, arm-softfp-musl, riscv64-glibc, riscv64-musl]
        mode: [debug, profile, release]
        include:
          - target: x64
            defconfig: ''
          - target: x64-musl
            defconfig: titan_x64_musl_defconfig
          - target: arm64
            defconfig: titan_arm64_glibc_defconfig
          - target: arm64-musl
            defconfig: titan_arm64_musl_defconfig
          - target: arm-hard
            defconfig: titan_armv7a_hf_glibc_defconfig
          - target: arm-hard-musl
            defconfig: titan_armv7a_hf_musl_defconfig
          - target: arm-softfp
            defconfig: titan_armv7a_softfp_glibc_defconfig
          - target: arm-softfp-musl
            defconfig: titan_armv7a_softfp_musl_defconfig
          - target: riscv64-glibc
            defconfig: titan_riscv64_glibc_defconfig
          - target: riscv64-musl
            defconfig: titan_riscv64_musl_defconfig
    env:
      TITAN_WORK_DIR: /mnt/titan/work
      TITAN_BUNDLE_DIR: /mnt/titan/bundles
      TITAN_VARIANTS: ${{ matrix.target }}-${{ matrix.mode }}
      TITAN_PARALLEL: 1
      GH_TOKEN: ${{ github.token }}
      CCACHE_MAXSIZE: 900M
    steps:
      - uses: actions/checkout@v4
      - name: Prepare workspace
        run: |
          sudo mkdir -p /mnt/titan
          sudo chown "$USER" /mnt/titan
      - name: Install dependencies
        run: scripts/ci.sh deps
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: /mnt/titan/work/ccache
          key: ccache-${{ matrix.target }}-${{ matrix.mode }}-${{ hashFiles('flutter.lock', 'patches/**') }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.target }}-${{ matrix.mode }}-
            ccache-${{ matrix.target }}-
      - name: Download sysroot
        if: matrix.defconfig != ''
        uses: actions/download-artifact@v4
        with:
          name: sysroot-${{ matrix.defconfig }}
          path: /mnt/titan/work
      - name: Extract sysroot
        if: matrix.defconfig != ''
        run: scripts/ci.sh sysroot-extract "${{ matrix.defconfig }}"
      - name: Build engine
        id: build
        run: scripts/ci.sh build
      - name: Save ccache
        if: always() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure')
        uses: actions/cache/save@v4
        with:
          path: /mnt/titan/work/ccache
          key: ccache-${{ matrix.target }}-${{ matrix.mode }}-${{ hashFiles('flutter.lock', 'patches/**') }}-${{ github.run_id }}
      - name: Probe debug bundle
        if: matrix.mode == 'debug'
        run: scripts/ci.sh probe
      - name: Package engine bundle
        run: scripts/ci.sh package
      - name: Build SDK variants
        run: |
          sdk_variants=$(scripts/ci.sh linux-sdk-variants "${{ matrix.target }}" "${{ matrix.mode }}")
          read -r -a sdk_variants_array <<<"$sdk_variants"
          scripts/ci.sh with-progress "${sdk_variants_array[@]}" -- scripts/build-matrix.sh --parallel 1 --zip "${sdk_variants_array[@]}"
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.target }}-${{ matrix.mode }}
          path: /mnt/titan/work/matrix/
          if-no-files-found: ignore
      - name: Upload engine and SDK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-${{ matrix.target }}-${{ matrix.mode }}
          path: |
            /mnt/titan/bundles/dist/*.zip
            /mnt/titan/work/flutter/engine/src/out/*/zip_archives/**
          if-no-files-found: error

  linux_platform:
    name: Build platform artifact (${{ matrix.variant || format('android-{0}-{1}', matrix.mode, matrix.android_cpu) }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        android_cpu: [arm, arm64, x64]
        mode: [debug, profile, release]
        include:
          - android_cpu: web
            mode: release
            variant: web-release
    env:
      TITAN_WORK_DIR: /mnt/titan/work
      TITAN_BUNDLE_DIR: /mnt/titan/bundles
      TITAN_VARIANTS: ${{ matrix.variant || format('android-{0}-{1}', matrix.mode, matrix.android_cpu) }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare workspace
        run: |
          sudo mkdir -p /mnt/titan
          sudo chown "$USER" /mnt/titan
      - name: Install dependencies
        run: scripts/ci.sh deps
      - name: Build platform artifact
        run: scripts/ci.sh with-progress "$TITAN_VARIANTS" -- scripts/build-matrix.sh --parallel 1 --zip "$TITAN_VARIANTS"
      - name: Upload Linux platform build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.variant || format('android-{0}-{1}', matrix.mode, matrix.android_cpu) }}
          path: /mnt/titan/work/matrix/
          if-no-files-found: ignore
      - name: Upload Linux platform archives
        uses: actions/upload-artifact@v4
        with:
          name: flutter-sdk-${{ matrix.variant || format('android-{0}-{1}', matrix.mode, matrix.android_cpu) }}
          path: /mnt/titan/work/flutter/engine/src/out/*/zip_archives/**
          if-no-files-found: error

  macos:
    name: Build macOS and iOS artifacts (${{ matrix.mode }})
    runs-on: macos-15
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, profile, release]
    env:
      TITAN_MODE: ${{ matrix.mode }}
      TITAN_VARIANT: macos-arm64-${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      # The runner context is not available at job level, so the work
      # directory under RUNNER_TEMP is exported from the first step.
      - name: Set work directory
        run: echo "TITAN_WORK_DIR=$RUNNER_TEMP/titan/work" >> "$GITHUB_ENV"
      # The checkout scripts serialize patch application with flock(1), which
      # macOS does not ship; Homebrew's flock has the util-linux semantics.
      # The build scripts also need bash 4+ (associative arrays, mapfile),
      # and macOS ships bash 3.2; Homebrew's bin precedes /bin on the runner.
      # coreutils provides sha256sum for the patch-series stamp.
      - name: Install flock, bash and coreutils
        run: |
          brew install flock bash coreutils
          bash -c '((BASH_VERSINFO[0] >= 4))' || { echo "bash 4+ is not first on PATH" >&2; exit 1; }
      - name: Build macOS and iOS artifacts
        run: |
          mode="$TITAN_MODE"
          progress_variants=(
            "macos-arm64-$mode-host"
            "macos-arm64-$mode-framework"
            "macos-arm64-$mode-gen-snapshot"
            "macos-arm64-$mode-ios-device"
            "macos-arm64-$mode-ios-simulator"
          )
          if [[ "$mode" == profile || "$mode" == release ]]; then
            for android_cpu in arm arm64 x64; do
              progress_variants+=("macos-arm64-$mode-android-$android_cpu")
            done
          fi
          scripts/ci.sh with-progress "${progress_variants[@]}" -- bash -c '
            run_logged_build() {
              local variant=$1
              shift
              local log="$TITAN_WORK_DIR/matrix/$variant.log"
              mkdir -p "$(dirname "$log")"
              "$@" >"$log" 2>&1
            }

            mode=$1
            run_logged_build "macos-arm64-$mode-host" scripts/build-engine-macos.sh --kind host --mode "$mode" --cpu arm64 --out-name "host_$mode" --jobs 2
            run_logged_build "macos-arm64-$mode-framework" scripts/build-engine-macos.sh --kind framework --mode "$mode" --cpu arm64 --out-name "host_${mode}_framework" --jobs 2
            run_logged_build "macos-arm64-$mode-gen-snapshot" scripts/build-engine-macos.sh --kind gen-snapshot --mode "$mode" --cpu arm64 --out-name "host_${mode}_gen_snapshot" --jobs 2
            run_logged_build "macos-arm64-$mode-ios-device" scripts/build-engine-macos.sh --kind ios --mode "$mode" --cpu arm64 --out-name "ios_$mode" --jobs 2
            run_logged_build "macos-arm64-$mode-ios-simulator" scripts/build-engine-macos.sh --kind ios --mode "$mode" --cpu arm64 --simulator --simulator-cpu arm64 --out-name "ios_${mode}_simulator_arm64" --jobs 2
            if [[ "$mode" == profile || "$mode" == release ]]; then
              for android_cpu in arm arm64 x64; do
                run_logged_build "macos-arm64-$mode-android-$android_cpu" scripts/build-engine-macos.sh --kind android --mode "$mode" --android-cpu "$android_cpu" --out-name "android_${mode}_$android_cpu" --jobs 2
              done
            fi
          ' bash "$mode"
      - name: Upload macOS build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-macos-arm64-${{ matrix.mode }}
          path: ${{ runner.temp }}/titan/work/matrix/
          if-no-files-found: ignore
      - name: Upload macOS archives
        uses: actions/upload-artifact@v4
        with:
          name: flutter-sdk-macos-arm64-${{ matrix.mode }}
          path: ${{ runner.temp }}/titan/work/flutter/engine/src/out/*/zip_archives/**
          if-no-files-found: error

  windows:
    name: Build Windows artifact (${{ matrix.cpu }}-${{ matrix.mode }})
    runs-on: windows-2025
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        cpu: [x64, arm64]
        mode: [debug, profile, release]
    env:
      TITAN_WORK_DIR: C:\titan\work
      TITAN_CPU: ${{ matrix.cpu }}
      TITAN_MODE: ${{ matrix.mode }}
      TITAN_VARIANT: windows-${{ matrix.cpu }}-${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows and Android artifacts
        shell: pwsh
        run: |
          function Get-BuildArguments {
            param(
              [string]$Kind,
              [string]$Mode,
              [string]$Cpu,
              [string]$AndroidCpu
            )
            $arguments = @('-Kind', $Kind, '-Mode', $Mode, '-Jobs', '2')
            if ($Kind -eq 'host') {
              $arguments += @('-Cpu', $Cpu)
            } else {
              $arguments += @('-AndroidCpu', $AndroidCpu)
            }
            return $arguments
          }

          function Invoke-LoggedBuild {
            param([string]$Variant, [string[]]$Arguments)
            $log = Join-Path $matrixDirectory "$Variant.log"
            $buildJob = Start-Job -ScriptBlock {
              param([string]$ScriptPath, [string[]]$ScriptArguments, [string]$LogPath)
              & pwsh -NoProfile -File $ScriptPath @ScriptArguments *> $LogPath
              [int]$LASTEXITCODE
            } -ArgumentList 'scripts/build-engine-windows.ps1', $Arguments, $log
            try {
              do {
                Receive-Job -Job $heartbeat | ForEach-Object { Write-Host $_ }
                Start-Sleep -Seconds 1
              } while ((Get-Job -Id $buildJob.Id).State -in @('NotStarted', 'Running'))
              $exitCode = [int](Receive-Job -Job $buildJob -Wait | Select-Object -Last 1)
            } finally {
              Remove-Job -Job $buildJob -Force -ErrorAction SilentlyContinue
            }
            if ($exitCode -ne 0) {
              throw "Windows build failed for $Variant with exit code $exitCode"
            }
          }

          if ($env:TITAN_BUILD_ARGUMENTS_ONLY -eq 'true') {
            $hostArguments = Get-BuildArguments 'host' $env:TITAN_MODE $env:TITAN_CPU ''
            Write-Output "host=$($hostArguments -join ' ')"
            if ($env:TITAN_CPU -eq 'x64' -and $env:TITAN_MODE -in @('profile', 'release')) {
              foreach ($androidCpu in @('arm', 'arm64', 'x64')) {
                $androidArguments = Get-BuildArguments 'android' $env:TITAN_MODE $env:TITAN_CPU $androidCpu
                Write-Output "android-$androidCpu=$($androidArguments -join ' ')"
              }
            }
            exit 0
          }

          $progressInterval = if ([string]::IsNullOrWhiteSpace($env:TITAN_PROGRESS_SECONDS)) { 60 } else { [int]$env:TITAN_PROGRESS_SECONDS }
          $progressVariants = @($env:TITAN_VARIANT)
          if ($env:TITAN_CPU -eq 'x64' -and $env:TITAN_MODE -in @('profile', 'release')) {
            $progressVariants += foreach ($androidCpu in @('arm', 'arm64', 'x64')) {
              "windows-$($env:TITAN_CPU)-$($env:TITAN_MODE)-android-$androidCpu"
            }
          }
          $matrixDirectory = Join-Path $env:TITAN_WORK_DIR 'matrix'
          New-Item -ItemType Directory -Force -Path $matrixDirectory | Out-Null
          $heartbeat = Start-Job -ScriptBlock {
            param([string[]]$Variants, [string]$WorkDirectory, [int]$Interval)
            while ($true) {
              Start-Sleep -Seconds $Interval
              foreach ($variant in $Variants) {
                $log = Join-Path (Join-Path $WorkDirectory 'matrix') "$variant.log"
                $status = if (Test-Path -LiteralPath $log) {
                  Get-Content -LiteralPath $log -Tail 4096 -ErrorAction SilentlyContinue |
                    Select-String -Pattern '^\[[0-9]+/[0-9]+\]' |
                    Select-Object -Last 1
                }
                if ($null -eq $status) {
                  "$variant`: preparing (checkout, gclient, GN)"
                } else {
                  "$variant`: $($status.Line)"
                }
              }
            }
          } -ArgumentList $progressVariants, $env:TITAN_WORK_DIR, $progressInterval
          try {
            $hostArguments = Get-BuildArguments 'host' $env:TITAN_MODE $env:TITAN_CPU ''
            Invoke-LoggedBuild $env:TITAN_VARIANT $hostArguments
            if ($env:TITAN_CPU -eq 'x64' -and $env:TITAN_MODE -in @('profile', 'release')) {
              foreach ($androidCpu in @('arm', 'arm64', 'x64')) {
                $androidArguments = Get-BuildArguments 'android' $env:TITAN_MODE $env:TITAN_CPU $androidCpu
                $androidVariant = "windows-$($env:TITAN_CPU)-$($env:TITAN_MODE)-android-$androidCpu"
                Invoke-LoggedBuild $androidVariant $androidArguments
              }
            }
          } finally {
            Stop-Job -Job $heartbeat -ErrorAction SilentlyContinue
            Receive-Job -Job $heartbeat -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
            Remove-Job -Job $heartbeat -Force -ErrorAction SilentlyContinue
          }
      - name: Upload Windows build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-windows-${{ matrix.cpu }}-${{ matrix.mode }}
          path: C:\titan\work\matrix\
          if-no-files-found: ignore
      - name: Upload Windows archives
        uses: actions/upload-artifact@v4
        with:
          name: flutter-sdk-windows-${{ matrix.cpu }}-${{ matrix.mode }}
          path: C:\titan\work\flutter\engine\src\out\*\zip_archives\**
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [build, linux_platform, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TITAN_WORK_DIR: /mnt/titan/work
      TITAN_BUNDLE_DIR: /mnt/titan/bundles
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare workspace
        run: |
          sudo mkdir -p /mnt/titan
          sudo chown "$USER" /mnt/titan
      - name: Download Linux engine and SDK artifacts
        uses: actions/download-artifact@v4
        with:
          path: /mnt/titan
          pattern: flutter-build-*
          merge-multiple: true
      - name: Download Flutter SDK archives
        uses: actions/download-artifact@v4
        with:
          path: /mnt/titan/work/flutter/engine/src/out
          pattern: flutter-sdk-*
          merge-multiple: true
      - name: Checkout pinned Flutter revision
        run: |
          flutter_commit=$(sed -n 's/^flutter_commit=//p' flutter.lock)
          git clone --filter=blob:none https://github.com/flutter/flutter.git /mnt/titan/work/flutter
          git -C /mnt/titan/work/flutter fetch --depth 1 origin "$flutter_commit"
          git -C /mnt/titan/work/flutter checkout --detach "$flutter_commit"
      - name: Assemble complete SDK layout
        run: scripts/ci.sh assemble
      - name: Package complete SDK
        working-directory: /mnt/titan/bundles/sdk
        run: zip -qr "/mnt/titan/bundles/dist/flutter-engine-sdk-${GITHUB_REF_NAME}.zip" flutter_infra_release MANIFEST
      - name: Create release checksums
        working-directory: /mnt/titan/bundles/dist
        run: find . -maxdepth 1 -type f -name '*.zip' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Publish GitHub release
        run: scripts/ci.sh release
