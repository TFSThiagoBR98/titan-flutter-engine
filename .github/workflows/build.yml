name: Flutter Engine

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Flutter Engine
    runs-on: docker
    container:
      image: node:24-trixie
      options: "-v /srv/titan-flutter-engine:/cache"
    env:
      TITAN_WORK_DIR: /cache/work
      TITAN_BUNDLE_DIR: /cache/bundles
    timeout-minutes: 600
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: scripts/ci.sh deps

      - name: Build Buildroot sysroots
        run: scripts/ci.sh sysroots

      - name: Build engine matrix
        run: scripts/ci.sh build

      - name: Probe engine bundles
        run: scripts/ci.sh probe

      - name: Package engine bundles
        run: scripts/ci.sh package

      - name: Upload engine bundles
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v3
        with:
          name: flutter-engine-dist
          path: /cache/bundles/dist/
          if-no-files-found: error

      - name: Publish Forgejo release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: scripts/ci.sh release
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
