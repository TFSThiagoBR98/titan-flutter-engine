name: titan_probe_app
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

flutter:
  uses-material-design: true
  # Bundled so the probe frame does not depend on the host's /usr/share/fonts
  # (the engine without fontconfig falls back to that directory).
  fonts:
    - family: TitanProbe
      fonts:
        - asset: fonts/Roboto-Regular.ttf
